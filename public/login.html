<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    
    <!-- NO INDEXAR PÁGINAS DE ADMIN -->
    <title>Login - Panel Administrativo</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Acceso administrativo">

    <!-- ESTILOS -->
    <link rel="stylesheet" href="css/login.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&amp;display=swap" rel="stylesheet" />
</head>

<body>

    <!-- Contenedor principal del login -->
    <div class="login-container">
        <!-- Logo -->
        <div class="logo">
            <img src="img/DJ_Logo_PNG.png" alt="Deriva Jurídico" />
        </div>
        <!-- Título y subtítulo -->
        <h1>Iniciar sesión</h1>
        <p class="subtitle">Ingresa tus credenciales de administrador para acceder</p>
        <!-- Formulario de login -->
        <form id="login-form" novalidate>
            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" placeholder="user@example.com" required />
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="********" required />
            </div>
            <button type="submit">Ingresar</button>
            <div class="links">
                <a href="/">Volver al inicio</a>
            </div>
        </form>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/login.js"></script>
</body>

</html>
